<!doctype html>
<html lang="en">

<script>
  window.addEventListener('error', (e) => {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;inset:0;background:#000;color:#f00;padding:20px;font:12px monospace;white-space:pre-wrap;z-index:99999;overflow:auto';
    el.textContent = 'ERROR: ' + e.message + '\n' + (e.error?.stack ?? '');
    document.body.appendChild(el);
  });
</script>
